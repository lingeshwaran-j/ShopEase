<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase — India's Premier B2B Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#2563EB;--purple:#7C3AED;--dark:#111827;--gray:#6B7280;--border:#E5E7EB;--light:#F9FAFB;--green:#059669;--red:#DC2626;--yellow:#D97706}
body{font-family:'DM Sans',sans-serif;background:#F9FAFB;color:#111827;min-height:100vh}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:700;font-size:14px;transition:all .15s;text-decoration:none}
.btn:active{opacity:.8}
.btn:disabled{opacity:.45;cursor:not-allowed!important;transform:none!important}
.btn-primary{background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;padding:10px 20px}
.btn-primary:hover:not(:disabled){opacity:.9;transform:translateY(-1px)}
.btn-outline{background:#fff;color:#374151;border:1.5px solid #E5E7EB;padding:9px 18px}
.btn-outline:hover{border-color:#2563EB;color:#2563EB}
.btn-ghost{background:transparent;color:#4B5563;padding:8px 16px}
.btn-ghost:hover{background:#F3F4F6}
.btn-ghost.active{background:#EFF6FF;color:#2563EB}
.btn-danger{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;padding:6px 12px;font-size:12px;border-radius:8px;cursor:pointer;font-weight:700}
.btn-edit{background:#EFF6FF;color:#2563EB;border:1px solid #BFDBFE;padding:6px 14px;font-size:12px;border-radius:8px;cursor:pointer;font-weight:700}
.btn-verify{background:#D1FAE5;color:#065F46;border:1px solid #6EE7B7;padding:5px 12px;font-size:12px;border-radius:8px;cursor:pointer;font-weight:700}
.btn-reject{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;padding:5px 12px;font-size:12px;border-radius:8px;cursor:pointer;font-weight:700}
.btn-logout{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;padding:8px 14px;font-size:13px}
.btn-lg{padding:14px 32px;font-size:16px;border-radius:12px}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:8px}
.inp{width:100%;padding:11px 16px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s;background:#fff}
.inp:focus{border-color:#2563EB}
.inp-green:focus{border-color:#059669}
textarea.inp{resize:vertical;min-height:80px}
select.inp{cursor:pointer}
#navbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid #E5E7EB;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;color:inherit}
.nav-logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#2563EB,#7C3AED);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.nav-logo-text{font-size:20px;font-weight:900;letter-spacing:-.5px}
.nav-links{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cart-badge{background:#EF4444;color:#fff;border-radius:20px;padding:2px 8px;font-size:12px;font-weight:800}
.user-chip{display:flex;align-items:center;gap:8px;background:#F9FAFB;border:1.5px solid #E5E7EB;border-radius:12px;padding:6px 14px 6px 8px}
.uavatar{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:900;background:linear-gradient(135deg,#7C3AED,#4F46E5)}
.u-name{font-size:13px;font-weight:700;line-height:1.2}
.u-role{font-size:11px;font-weight:600;color:#7C3AED;line-height:1.2}
.hero{background:linear-gradient(135deg,#1E3A8A 0%,#312E81 50%,#1E1B4B 100%);padding:80px 24px;color:#fff;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 50%,rgba(99,102,241,.3) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(37,99,235,.4) 0%,transparent 40%)}
.hero-inner{position:relative;z-index:1;max-width:1200px;margin:0 auto;text-align:center}
.hero-badge{display:inline-block;background:rgba(255,255,255,.15);backdrop-filter:blur(4px);border-radius:20px;padding:6px 18px;font-size:13px;font-weight:600;margin-bottom:24px}
.hero-title{font-size:clamp(30px,5vw,58px);font-weight:900;letter-spacing:-2px;margin-bottom:16px;line-height:1.1}
.hero-sub{font-size:17px;color:rgba(255,255,255,.75);max-width:520px;margin:0 auto 40px}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:60px}
.hero-btn1{background:#fff;color:#1E3A8A;border:none;border-radius:12px;padding:14px 36px;cursor:pointer;font-size:16px;font-weight:800;font-family:'DM Sans',sans-serif;transition:transform .15s}
.hero-btn1:hover{transform:translateY(-2px)}
.hero-btn2{background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:12px;padding:14px 36px;cursor:pointer;font-size:16px;font-weight:700;font-family:'DM Sans',sans-serif}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.feat-card{background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border-radius:16px;padding:24px 20px;border:1px solid rgba(255,255,255,.12);text-align:center}
.section{max-width:1200px;margin:0 auto;padding:40px 24px}
.sec-title{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:24px}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.prod-card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #F3F4F6;transition:transform .2s,box-shadow .2s}
.prod-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.1)}
.prod-img-wrap{position:relative;height:200px;background:#F3F4F6;overflow:hidden;cursor:pointer}
.prod-img{width:100%;height:100%;object-fit:cover;display:block}
.prod-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#E5E7EB,#F9FAFB)}
.prod-body{padding:16px}
.prod-name{font-weight:700;font-size:15px;margin-bottom:6px;line-height:1.3;cursor:pointer}
.prod-desc{color:#6B7280;font-size:13px;margin-bottom:10px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-price{font-size:20px;font-weight:800;color:#2563EB}
.prod-actions{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.pill{display:inline-block;background:#EFF6FF;color:#2563EB;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;margin-bottom:8px}
.bdg{border-radius:6px;padding:3px 10px;font-size:11px;font-weight:800;position:absolute;top:12px;left:12px;z-index:1}
.bdg-bestseller{background:#2563EB;color:#fff}
.bdg-new{background:#059669;color:#fff}
.bdg-hot{background:#EF4444;color:#fff}
.bdg-sale{background:#D97706;color:#fff}
.bdg-limited{background:#7C3AED;color:#fff}
.stars{color:#F59E0B;font-size:13px}
.stars span{color:#6B7280;font-size:12px;margin-left:4px}
.sts{display:inline-block;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.sts-pending{background:#FEF3C7;color:#92400E}
.sts-awaiting_payment{background:#FEF3C7;color:#92400E}
.sts-payment_submitted{background:#DBEAFE;color:#1E40AF}
.sts-confirmed{background:#D1FAE5;color:#065F46}
.sts-shipped{background:#E0E7FF;color:#3730A3}
.sts-delivered{background:#D1FAE5;color:#065F46}
.sts-cancelled{background:#FEE2E2;color:#991B1B}
.sts-payment_rejected{background:#FEE2E2;color:#991B1B}
.utr-badge{background:#ECFDF5;border:1px solid #6EE7B7;color:#065F46;border-radius:8px;padding:3px 10px;font-size:11px;font-weight:700;font-family:monospace;letter-spacing:.5px}
.card{background:#fff;border-radius:20px;border:1px solid #F3F4F6;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-body{padding:24px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:12px 16px;text-align:left;font-size:12px;font-weight:700;color:#6B7280;border-bottom:2px solid #F3F4F6;background:#F9FAFB;white-space:nowrap}
td{padding:11px 16px;font-size:13px;color:#374151;border-bottom:1px solid #F3F4F6;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAFA}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px;margin-bottom:28px}
.stat-card{border-radius:14px;padding:18px 20px;text-align:center}
.stat-val{font-size:24px;font-weight:900}
.stat-lbl{font-size:11px;font-weight:600;color:#6B7280;margin-top:4px}
.cart-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #F3F4F6;align-items:center}
.qty-btn{width:30px;height:30px;border:1.5px solid #E5E7EB;border-radius:8px;background:#F9FAFB;cursor:pointer;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif}
.qty-btn:hover{background:#E5E7EB}
.qr-box{background:#fff;border:2px solid #E0E7FF;border-radius:20px;padding:28px;text-align:center;margin-bottom:20px}
.qr-img{width:200px;height:200px;border-radius:12px;border:3px solid #E5E7EB;margin:0 auto 16px;display:block;background:#F3F4F6}
.upi-id-box{background:#F5F3FF;border:1px solid #DDD6FE;border-radius:10px;padding:10px 16px;font-family:monospace;font-size:15px;font-weight:700;color:#5B21B6;letter-spacing:.5px;margin-bottom:16px}
.amt-chip{background:#FFF7ED;border:2px solid #FED7AA;border-radius:12px;padding:12px 20px;text-align:center;margin-bottom:16px}
.utr-wrap{background:#F0FDF4;border:2px solid #86EFAC;border-radius:16px;padding:22px}
.utr-steps{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;text-align:left}
.utr-step{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#374151}
.utr-num{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.modal-ov{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:20px;width:100%;max-width:680px;max-height:90vh;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:modalIn .2s ease;display:flex;flex-direction:column;overflow:hidden}
.modal-box-sm{max-width:460px}
.modal-hdr{background:linear-gradient(135deg,#2563EB,#7C3AED);padding:20px 28px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-body{padding:28px;overflow-y:auto;flex:1}
.modal-ftr{padding:16px 28px;border-top:1px solid #F3F4F6;display:flex;gap:12px;justify-content:flex-end;background:#F9FAFB;flex-shrink:0}
.modal-close{background:rgba(255,255,255,.2);border:none;color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;font-family:inherit}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg-full{grid-column:1/-1}
.form-lbl{display:block;font-size:13px;font-weight:700;color:#374151;margin-bottom:6px}
.img-prev{margin-top:10px;border-radius:10px;overflow:hidden;border:1.5px solid #E5E7EB;height:130px;display:none}
.img-prev img{width:100%;height:100%;object-fit:cover}
.login-pg{min-height:100vh;background:linear-gradient(135deg,#0F172A 0%,#1E3A8A 50%,#312E81 100%);display:flex;align-items:center;justify-content:center;padding:20px;position:relative}
.login-pg::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 15% 50%,rgba(99,102,241,.25) 0%,transparent 50%)}
.login-wrap{position:relative;width:100%;max-width:440px}
.login-box{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.4);animation:modalIn .3s ease}
.empty{text-align:center;padding:72px 24px;background:#fff;border-radius:20px;border:1px solid #F3F4F6}
.empty-icon{font-size:56px;margin-bottom:16px}
.empty-title{font-weight:700;font-size:20px;margin-bottom:8px}
.empty-desc{color:#6B7280;margin-bottom:24px}
.order-card{background:#fff;border-radius:16px;border:1px solid #F3F4F6;padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.conf-box{display:inline-flex;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:16px;padding:18px 32px;margin-bottom:36px;gap:32px;flex-wrap:wrap;justify-content:center}
.conf-lbl{font-size:11px;color:#6B7280;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.conf-val{font-weight:800;color:#065F46;font-size:14px}
.co-grid{display:grid;grid-template-columns:1fr 360px;gap:24px}
.co-sec{background:#fff;border-radius:18px;border:1px solid #F3F4F6;padding:22px;margin-bottom:16px}
.co-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.co-form-full{grid-column:1/-1}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:60px}
.det-img-wrap{height:400px;border-radius:20px;overflow:hidden;background:#F3F4F6}
.det-img{width:100%;height:100%;object-fit:cover}
.det-price{font-size:34px;font-weight:900;color:#2563EB;margin:20px 0}
.ship-note{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:12px;padding:14px 18px;font-size:13px;color:#065F46;margin-top:20px}
.why-card{background:#F9FAFB;border-radius:14px;padding:22px;border:1px solid #F3F4F6}
.search-bar{background:#fff;border-bottom:1px solid #E5E7EB;position:sticky;top:64px;z-index:40;padding:14px 24px}
.search-inner{max-width:1200px;margin:0 auto}
.search-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.s-wrap{flex:1;min-width:180px;position:relative;margin-right:6px}
#toast{position:fixed;bottom:28px;right:28px;z-index:9999;background:#111827;color:#fff;padding:13px 20px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.3);animation:fadeUp .3s ease;display:none;align-items:center;gap:10px;max-width:350px}
footer{background:#111827;color:#9CA3AF;padding:36px 24px;text-align:center;margin-top:40px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@media(max-width:960px){.co-grid{grid-template-columns:1fr}.det-grid{grid-template-columns:1fr;gap:24px}.det-img-wrap{height:280px}}
@media(max-width:640px){.hero{padding:48px 16px}.section{padding:24px 16px}#navbar{padding:0 16px}.nav-links .btn-ghost{display:none}.prod-grid{grid-template-columns:1fr 1fr}.co-form{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
@media(max-width:420px){.prod-grid{grid-template-columns:1fr}.conf-box{gap:16px;padding:16px}}

/* ── AI CHAT WIDGET ───────────────────────── */
#chat-fab{position:fixed;bottom:24px;right:24px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;border:none;cursor:pointer;box-shadow:0 8px 24px rgba(37,99,235,.4);z-index:200;font-size:26px;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#chat-fab:hover{transform:scale(1.06)}
#chat-fab .dot{position:absolute;top:2px;right:2px;width:14px;height:14px;background:#22C55E;border:2px solid #fff;border-radius:50%}
#chat-panel{position:fixed;bottom:96px;right:24px;width:360px;max-width:calc(100vw - 32px);height:520px;max-height:calc(100vh - 140px);background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);z-index:200;display:none;flex-direction:column;overflow:hidden;border:1px solid #E5E7EB}
#chat-panel.open{display:flex}
#chat-hdr{background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px}
#chat-hdr .ttl{font-weight:800;font-size:15px;line-height:1.2}
#chat-hdr .sub{font-size:11.5px;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:5px}
#chat-hdr .sub::before{content:'';width:7px;height:7px;border-radius:50%;background:#22C55E}
#chat-hdr .x{margin-left:auto;background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:15px}
#chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#F9FAFB}
.cmsg{max-width:82%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.5}
.cmsg-bot{background:#fff;border:1px solid #E5E7EB;align-self:flex-start;border-bottom-left-radius:4px}
.cmsg-user{background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.cmsg-prod{display:flex;gap:10px;align-items:center;border:1px solid #E5E7EB;border-radius:10px;padding:8px;cursor:pointer;background:#F9FAFB;margin-top:6px}
.cmsg-prod:hover{border-color:#2563EB}
.cmsg-prod img,.cmsg-prod .ph{width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0}
.cmsg-prod .ph{display:flex;align-items:center;justify-content:center;background:#E5E7EB;font-size:18px}
.cmsg-prod .nm{font-size:12.5px;font-weight:700;line-height:1.3}
.cmsg-prod .pr{font-size:12px;color:#2563EB;font-weight:800}
.cchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.cchip{background:#fff;border:1px solid #E5E7EB;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:#374151}
.cchip:hover{border-color:#2563EB;color:#2563EB}
#chat-inp-row{display:flex;gap:8px;padding:12px;border-top:1px solid #E5E7EB;background:#fff}
#chat-inp{flex:1;border:1.5px solid #E5E7EB;border-radius:10px;padding:10px 13px;font-size:13.5px;font-family:'DM Sans',sans-serif;outline:none;resize:none}
#chat-inp:focus{border-color:#2563EB}
#chat-send{background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;border:none;width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:16px;flex-shrink:0}
.ctyping{display:flex;gap:4px;padding:12px 13px;align-self:flex-start;background:#fff;border:1px solid #E5E7EB;border-radius:14px;border-bottom-left-radius:4px}
.ctyping span{width:6px;height:6px;border-radius:50%;background:#9CA3AF;animation:cbounce 1.2s infinite}
.ctyping span:nth-child(2){animation-delay:.2s}.ctyping span:nth-child(3){animation-delay:.4s}
@keyframes cbounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@media(max-width:420px){#chat-panel{right:16px;left:16px;width:auto;bottom:88px}#chat-fab{right:16px}}
</style>
</head>
<body>
<div id="app">
  <nav id="navbar"></nav>
  <main id="main" style="min-height:calc(100vh - 64px)"></main>
  <footer id="footer">
    <div style="font-size:22px;font-weight:800;color:#fff;margin-bottom:8px">🛍️ ShopEase</div>
    <p style="font-size:14px;margin-bottom:10px">UPI QR Payment · UTR Verification · Admin Panel · INR ₹ Prices</p>
    <p style="font-size:12px;color:#4B5563">© 2025 ShopEase. All rights reserved.</p>
  </footer>
</div>
<div id="modal-root"></div>
<div id="toast"><span id="toast-icon" style="font-size:18px">✓</span><span id="toast-msg"></span></div>

<!-- ── AI CHAT WIDGET ─────────────────────── -->
<button id="chat-fab" onclick="Chat.toggle()" aria-label="Chat with ShopEase AI Assistant">
  💬<span class="dot"></span>
</button>
<div id="chat-panel">
  <div id="chat-hdr">
    <div>
      <div class="ttl">ShopEase AI Assistant</div>
      <div class="sub">Online 24/7</div>
    </div>
    <button class="x" onclick="Chat.toggle(false)">✕</button>

          </div>
          <div class="fg-full"><label class="form-lbl">Description *</label><textarea class="inp" id="m-desc" rows="3" placeholder="Short product description…">${esc(p.desc)}</textarea></div>
          <div class="fg-full">
            <label class="form-lbl">Product Image <span style="font-weight:400;color:#9CA3AF">(choose a photo from your gallery)</span></label>

              <button type="button" class="btn btn-outline btn-sm" style="margin-top:8px" onclick="App.clearImg()">Remove image</button>
            </div>

        </div>
        <div id="m-err" style="display:none;background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:10px 14px;font-size:13px;color:#DC2626;margin-top:14px">⚠️ Name, price and description are required.</div>
      </div>

  </div>`;

/* ── APP CONTROLLER ────────────────────────── */
const App={
  /* AUTH */
  toggleEye(){const i=document.getElementById('l-pass'),b=document.getElementById('eye-btn');if(!i)return;i.type=i.type==='password'?'text':'password';if(b)b.textContent=i.type==='password'?'👁️':'🙈';},
  doLogin(){
    const email=(document.getElementById('l-email')?.value||'').trim().toLowerCase();
    const pass=document.getElementById('l-pass')?.value||'';
    const btn=document.getElementById('login-btn');
    if(!email||!pass){this._err('Please enter email and password.');return;}
    if(btn){btn.disabled=true;btn.textContent='Signing in…';}
    setTimeout(()=>{
      const u=USERS.find(x=>x.role==='admin'&&x.email===email&&x.pass===pass);
      if(!u){if(btn){btn.disabled=false;btn.textContent='🔐 Access Admin Panel';}this._err('Invalid admin credentials.');return;}
      DB.user=u;toast(`Welcome, ${u.name}! 👋`);
      const r=R._al;R._al=null;R.go(r||'admin');
    },600);
  },
  _err(msg){const e=document.getElementById('login-err');if(e){e.textContent=msg;e.style.display='block';}},
  logout(){DB.user=null;DB.cart=[];toast('Logged out.');R.go('home');},

  /* SEARCH */
  doSearch(val){
    R.params.search=val;
    document.getElementById('main').innerHTML=pgProducts();
    const i=document.getElementById('s-inp');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}
  },
  setCat(id){R.params.cat=id;R.params.search='';render();},
  clearSearch(){R.params.cat=null;R.params.search='';render();},

  /* CART */
  addToCart(id,goCart=false){
    const p=DB.products.find(x=>x.id==id);if(!p)return;
    const cart=DB.cart,ex=cart.find(i=>i.id===p.id);
    DB.cart=ex?cart.map(i=>i.id===p.id?{...i,qty:i.qty+1}:i):[...cart,{id:p.id,name:p.name,price:p.price,img:p.img,cat:p.cat,qty:1}];
    toast(`"${p.name}" added to cart!`);drawNav();
    if(goCart)R.go('cart');
  },
  removeItem(id){DB.cart=DB.cart.filter(i=>i.id!==id);render();},
  setQty(id,qty){if(qty<1){this.removeItem(id);return;}DB.cart=DB.cart.map(i=>i.id===id?{...i,qty}:i);render();},

  /* CHECKOUT FLOW */
  goToPayment(){
    const name=document.getElementById('co-name')?.value?.trim();
    const phone=document.getElementById('co-phone')?.value?.trim();
    const addr=document.getElementById('co-addr')?.value?.trim();
    if(!name||!phone||!addr){const e=document.getElementById('co-err');if(e)e.style.display='block';return;}
    R.go('payment',{name,phone,addr,email:document.getElementById('co-email')?.value?.trim()||''});
  },
  onUtr(val){
    const btn=document.getElementById('submit-btn');
    if(btn)btn.disabled=val.trim().length<8;
    const e=document.getElementById('utr-err');if(e)e.style.display='none';
  },
  placeOrder(){
    const utr=document.getElementById('utr-inp')?.value?.trim();
    if(!utr||utr.length<8){
      const e=document.getElementById('utr-err');if(e){e.textContent='⚠️ Enter a valid UTR / Reference number (min 8 characters).';e.style.display='block';}return;
    }
    const cart=DB.cart;if(!cart.length)return;
    const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
    const order={
      id:Date.now(),num:`ORD-${Date.now().toString().slice(-8)}`,uid:0,
      date:new Date().toISOString().split('T')[0],total,
      status:'payment_submitted',utr:utr.replace(/\s/g,''),utrVerified:false,
      name:R.params.name||'Customer',phone:R.params.phone||'',addr:R.params.addr||'',
      items:cart.map(i=>({name:i.name,qty:i.qty,price:i.price})),
    };
    DB.orders=[order,...DB.orders];DB.cart=[];
    toast('Order placed! Admin will verify your UTR shortly. 🎉');
    R.go('confirmation',{order});
  },

  /* ADMIN — UTR */
  verifyUTR(id){DB.orders=DB.orders.map(o=>o.id===id?{...o,utrVerified:true,status:'confirmed'}:o);toast('✅ UTR verified! Order confirmed.');render();},
  rejectUTR(id){
    if(!confirm('Reject this UTR? Order will be marked as Payment Rejected.'))return;
    DB.orders=DB.orders.map(o=>o.id===id?{...o,utrVerified:false,status:'payment_rejected'}:o);
    toast('❌ UTR rejected.',true);render();
  },
  updateOrder(id,status){DB.orders=DB.orders.map(o=>o.id===id?{...o,status}:o);toast('Status updated!');render();},

  /* ADMIN — UPI */
  showUpi(){showUpiModal();},
  saveUpi(){
    const v=document.getElementById('upi-inp')?.value?.trim();
    if(!v){toast('Enter a UPI ID.',true);return;}
    DB.upiId=v;closeModal();toast('UPI ID updated! ✅');
  },

  /* PRODUCTS CRUD */
  openModal(pid){showProductModal(pid);},
  pickImg(e){
    const file=e.target.files&&e.target.files[0];
    if(!file){toast('No file was received from the picker.',true);return;}
    // Some Android gallery/content providers don't set file.type reliably —
    // only block genuinely non-image files (must have an explicit non-image type).
    if(file.type&&!file.type.startsWith('image/')){toast('Please choose an image file.',true);return;}
    const reader=new FileReader();
    reader.onerror=()=>toast('Could not read that file. Try a different photo.',true);
    reader.onload=(ev)=>{
      const rawDataUrl=ev.target.result;
      const applyImage=(dataUrl)=>{
        const hidden=document.getElementById('m-img'),prev=document.getElementById('img-prev'),tag=document.getElementById('img-prev-tag');
        if(hidden)hidden.value=dataUrl;
        if(tag)tag.src=dataUrl;
        if(prev)prev.style.display='block';
        toast('Photo added ✅');
      };
      const img=new Image();
      img.onload=()=>{
        try{
          const maxDim=900;
          let{width:w,height:h}=img;
          if(w>maxDim||h>maxDim){
            if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}
          }
          const canvas=document.createElement('canvas');
          canvas.width=w;canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          const compressed=canvas.toDataURL('image/jpeg',0.82);
          applyImage(compressed);
        }catch(err){
          // resizing failed (e.g. unsupported format for canvas) — fall back to the original file untouched
          applyImage(rawDataUrl);
        }
      };
      img.onerror=()=>{
        // browser couldn't decode this into an <img> (e.g. HEIC on a browser without support) —
        // still store the original file so it isn't lost; some browsers will render it anyway
        applyImage(rawDataUrl);
      };
      img.src=rawDataUrl;
    };
    reader.readAsDataURL(file);
  },
  clearImg(){
    const hidden=document.getElementById('m-img'),prev=document.getElementById('img-prev'),fileInp=document.getElementById('m-img-file');
    if(hidden)hidden.value='';
    if(prev)prev.style.display='none';
    if(fileInp)fileInp.value='';
  },
  saveProduct(pid){
    const name=document.getElementById('m-name')?.value?.trim();
    const price=document.getElementById('m-price')?.value;
    const desc=document.getElementById('m-desc')?.value?.trim();
    const cat=Number(document.getElementById('m-cat')?.value);
    const badge=document.getElementById('m-badge')?.value||null;
    const img=document.getElementById('m-img')?.value?.trim()||'';
    const rating=parseFloat(document.getElementById('m-rating')?.value)||4.5;
    if(!name||!price||!desc){const e=document.getElementById('m-err');if(e)e.style.display='block';return;}
    if(!pid){
      DB.products=[{id:Date.now(),name,price:Number(price),cat,badge:badge||null,img,desc,rating,reviews:0},...DB.products];
      toast(`"${name}" added!`);
    }else{
      DB.products=DB.products.map(p=>p.id==pid?{...p,name,price:Number(price),cat,badge:badge||null,img,desc,rating}:p);
      DB.cart=DB.cart.map(i=>i.id==pid?{...i,name,price:Number(price),img}:i);
      toast(`"${name}" updated!`);
    }
    closeModal();render();
  },
  delProduct(id){
    const p=DB.products.find(x=>x.id==id);if(!p)return;
    if(!confirm(`Delete "${p.name}"?\n\nThis cannot be undone.`))return;
    DB.products=DB.products.filter(x=>x.id!==id);
    DB.cart=DB.cart.filter(i=>i.id!==id);
    toast('Product deleted.');render();
  },
};

/* ══════════════════════════════════════════════════════════
   AI SHOPPING ASSISTANT — 24/7, fully client-side (no server
   required, so it's always available even if you host this
   as a plain static file). Understands products, prices,
   categories, order tracking and common store FAQs using the
   site's own live data (DB.products / DB.orders).

   OPTIONAL UPGRADE: to hook this up to a real LLM (OpenAI,
   Anthropic, etc.) for open-ended conversation, set
   CHAT_CONFIG.apiUrl + CHAT_CONFIG.apiKey below and see the
   `askLLM()` stub — it will be tried first, and this local
   assistant is used as an instant fallback if that call fails
   or isn't configured, so the bot never goes silent.
   ══════════════════════════════════════════════════════════ */
const CHAT_CONFIG={
  apiUrl:'',   // e.g. 'https://your-backend.example.com/api/chat' — leave blank to use local assistant only
  apiKey:'',   // never put a secret API key directly in shipped client HTML in production; proxy it through your own backend instead
};

const CHAT_FAQ=[
  {k:['shipping','delivery','how long','when will','arrive'],a:'Standard delivery takes 3–5 business days across India. You\'ll get tracking updates by SMS and email as soon as your order ships.'},
  {k:['return','refund','exchange'],a:'Items can be returned within 7 days of delivery if unused and in original packaging. Refunds go back to your original payment method within 5–7 business days.'},
  {k:['payment','upi','utr','pay','how do i pay'],a:'We accept UPI payments. After checkout, scan the QR code, pay, then enter your UPI transaction UTR number — our team verifies it, usually within a few hours.'},
  {k:['contact','support','human','talk to someone','agent'],a:'Reach our human support team at support@shopease.in or +91 98765 00000, Mon–Sat 9am–7pm IST. I\'m here 24/7 in the meantime for quick answers!'},
  {k:['hour','open','close','are you open'],a:'The store itself never closes — shop anytime, day or night. Human support is available Mon–Sat, 9am–7pm IST.'},
  {k:['admin','admin panel'],a:'The Admin Panel is for store staff to manage products and verify payments. Ask your site admin for access if you need it.'},
];

const CHAT_CHIPS=['Track my order','Show me best sellers','Shipping & returns policy','How do I pay?'];

function chatEsc(s){return esc(s);}

function chatGreeting(){
  const u=DB.user;
  return u
    ? `Hi ${chatEsc(u.name.split(' ')[0])}! 👋 I'm your ShopEase AI assistant. Ask me to find a product, compare prices, check an order, or answer a store question.`
    : `Hi there! 👋 I'm your ShopEase AI assistant, online 24/7. Ask me to find a product, check prices, or track an order.`;
}

function findProducts(text){
  const words=text.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2);
  if(!words.length)return[];
  const scored=DB.products.map(p=>{
    const hay=(p.name+' '+p.desc+' '+catName(p.cat)).toLowerCase();
    let score=0;
    words.forEach(w=>{if(hay.includes(w))score++;});
    return{p,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  return scored.slice(0,3).map(x=>x.p);
}

function findByBudget(text){
  const m=text.match(/(?:under|below|less than|within)\s*(?:₹|rs\.?|inr)?\s*([\d,]+)/i);
  if(!m)return null;
  const budget=parseInt(m[1].replace(/,/g,''),10);
  if(!budget)return null;
  return DB.products.filter(p=>p.price<=budget).sort((a,b)=>a.price-b.price).slice(0,3);
}

function findOrder(text){
  const numMatch=text.match(/ORD-\d{8}-\d{3}/i);
  const orders=DB.orders;
  if(numMatch){
    return orders.find(o=>o.num.toLowerCase()===numMatch[0].toLowerCase())||null;
  }
  const digits=text.match(/\d{3,}/);
  if(digits){
    return orders.find(o=>o.num.includes(digits[0]))||null;
  }
  return undefined; // undefined = no specific order number given at all
}

function productChip(p){
  const img=p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}">`:`<div class="ph">${CAT_ICON[p.cat]||'🛍️'}</div>`;
  return `<div class="cmsg-prod" onclick="R.go('detail',{id:${p.id}});Chat.toggle(false)">${img}<div><div class="nm">${esc(p.name)}</div><div class="pr">${inr(p.price)}</div></div></div>`;
}

function getBotReply(raw){
  const text=raw.trim();
  const low=text.toLowerCase();

  if(/\b(hi|hello|hey|good morning|good evening)\b/.test(low)&&text.length<25){
    return chatGreeting();
  }

  if(/order|track|utr|delivery status/.test(low)){
    const found=findOrder(low);
    if(found){
      return `Order <b>${esc(found.num)}</b> — status: <b>${esc(sl(found.status))}</b>.<br>Placed ${esc(fd(found.date))} · Total ${inr(found.total)}${found.utr?`<br>UTR: ${esc(found.utr)} (${found.utrVerified?'✓ verified':'pending verification'})`:''}`;
    }
    if(found===null){
      return `I couldn't find an order matching that number. Double-check it on the <b>My Orders</b> page, or share your order number like <i>ORD-20240401-001</i>.`;
    }
    if(DB.user){
      const mine=DB.orders.filter(o=>o.uid===DB.user.id);
      if(mine.length){
        return `Here are your recent orders — tap My Orders for full details:<br>`+mine.map(o=>`• <b>${esc(o.num)}</b>: ${esc(sl(o.status))}`).join('<br>');
      }
    }
    return `Sure — what's your order number (e.g. <i>ORD-20240401-001</i>)? You can also see everything under <b>My Orders</b>.`;
  }

  const budgetMatches=findByBudget(low);
  if(budgetMatches&&budgetMatches.length){
    return `Here's what I found in your budget:`+budgetMatches.map(productChip).join('');
  }

  if(/best.?seller|popular|top rated|recommend/.test(low)){
    const top=[...DB.products].sort((a,b)=>b.rating-a.rating).slice(0,3);
    return `Here are some of our top-rated picks:`+top.map(productChip).join('');
  }

  const cat=CATEGORIES.find(c=>low.includes(c.name.toLowerCase())||low.includes(c.name.split(' ')[0].toLowerCase()));
  if(cat){
    const items=DB.products.filter(p=>p.cat===cat.id).slice(0,3);
    if(items.length)return `Here's what we have in <b>${esc(cat.name)}</b>:`+items.map(productChip).join('');
  }

  const prodMatches=findProducts(low);
  if(prodMatches.length){
    return `Here's what I found:`+prodMatches.map(productChip).join('');
  }

  for(const faq of CHAT_FAQ){
    if(faq.k.some(k=>low.includes(k)))return faq.a;
  }

  if(/thank|thanks|thx/.test(low))return `You're welcome! Anything else I can help you find? 😊`;

  return `I'm not totally sure about that one — I can help with product search, prices, order tracking, and store policies (shipping, returns, payment). Try asking something like "show me headphones under 30000" or "track my order".`;
}

async function askLLM(text){
  if(!CHAT_CONFIG.apiUrl)return null;
  try{
    const res=await fetch(CHAT_CONFIG.apiUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json',...(CHAT_CONFIG.apiKey?{'Authorization':`Bearer ${CHAT_CONFIG.apiKey}`}:{})},
      body:JSON.stringify({message:text,history:Chat.messages})
    });
    if(!res.ok)return null;
    const data=await res.json();
    return data.reply||null;
  }catch(e){return null;}
}

const Chat={
  messages:[],
  open:false,
  toggle(force){
    this.open=force!==undefined?force:!this.open;
    document.getElementById('chat-panel').classList.toggle('open',this.open);
    if(this.open&&!this.messages.length)this.init();
    if(this.open)document.getElementById('chat-inp').focus();
  },
  init(){
    this.addBot(chatGreeting());
    this.renderChips(CHAT_CHIPS);
  },
  onKey(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();this.send();}
  },
  chip(text){
    document.getElementById('chat-inp').value=text;
    this.send();
  },
  renderChips(list){
    document.getElementById('chat-chips').innerHTML=list.map(c=>`<div class="cchip" onclick="Chat.chip('${c.replace(/'/g,"\\'")}')">${esc(c)}</div>`).join('');
  },
  addUser(text){
    this.messages.push({role:'user',content:text});
    const el=document.createElement('div');
    el.className='cmsg cmsg-user';
    el.textContent=text;
    document.getElementById('chat-body').appendChild(el);
    this.scrollDown();
  },
  addBot(html){
    this.messages.push({role:'assistant',content:html});
    const el=document.createElement('div');
    el.className='cmsg cmsg-bot';
    el.innerHTML=html;
    document.getElementById('chat-body').appendChild(el);
    this.scrollDown();
  },
  showTyping(){
    const el=document.createElement('div');
    el.className='ctyping';
    el.id='chat-typing';
    el.innerHTML='<span></span><span></span><span></span>';
    document.getElementById('chat-body').appendChild(el);
    this.scrollDown();
  },
  hideTyping(){
    const el=document.getElementById('chat-typing');
    if(el)el.remove();
  },
  scrollDown(){
    const body=document.getElementById('chat-body');
    requestAnimationFrame(()=>{body.scrollTop=body.scrollHeight;});
  },
  async send(){
    const inp=document.getElementById('chat-inp');
    const text=inp.value.trim();
    if(!text)return;
    inp.value='';
    document.getElementById('chat-chips').innerHTML='';
    this.addUser(text);
    this.showTyping();
    const llmReply=await askLLM(text);
    await new Promise(r=>setTimeout(r,350+Math.random()*350)); // natural typing pause
    this.hideTyping();
    this.addBot(llmReply||getBotReply(text));
    this.renderChips(CHAT_CHIPS);
  }
};
